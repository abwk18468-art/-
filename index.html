<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="theme-color" content="#0b1220"><script>try{var __t=localStorage.getItem("hs_theme");if(__t)document.documentElement.setAttribute("data-theme",__t)}catch(e){}</script>

<title>حسن صدام للمحاسبة</title>

<style>
:root{--bg:#f2f4f6;--card:#fff;--ink:#0f2a3d;--mute:#6b7c88;--line:#dde3e8;--debt:#b3261e;--pay:#0e7c66;--brass:#b8862b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1820;--card:#142632;--ink:#e8eef2;--mute:#8da0ad;--line:#25404f;--debt:#ff7b72;--pay:#4cc9a8;--brass:#e0b04f}}
:root[data-theme="dark"]{--bg:#0c1820;--card:#142632;--ink:#e8eef2;--mute:#8da0ad;--line:#25404f;--debt:#ff7b72;--pay:#4cc9a8;--brass:#e0b04f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;font-size:15px}
header{background:var(--ink);color:var(--bg);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:19px;font-weight:800}header small{color:var(--brass);display:block;font-size:12px}
main{max-width:720px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats .card{margin:0}.stats span{color:var(--mute);font-size:12px}.stats b{display:block;font-size:19px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.c{cursor:pointer}.nm{font-weight:600}.ph{color:var(--mute);font-size:12px;direction:ltr;text-align:right}
.debt{color:var(--debt);font-weight:800}.pay{color:var(--pay);font-weight:800}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;margin:4px 0}
button{font:inherit;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;background:var(--ink);color:var(--bg);font-weight:600}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.d{background:var(--debt);color:#fff}button.p{background:var(--pay);color:#fff}
button.wa{background:#1f9d55;color:#fff}button.tg{background:#2a8bc9;color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.btns>button{flex:1}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1}
.fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;border-radius:50%;width:54px;height:54px;font-size:26px;padding:0;background:var(--brass);color:#fff;box-shadow:0 3px 10px #0004}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.rc{border:2px dashed var(--brass);border-radius:8px;padding:12px;background:var(--card);white-space:pre-wrap;line-height:1.9}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
@media print{header,.btns,.fab,.tabs{display:none}}
@media print{body.th main,body.th header,body.th .fab,body.th .sheet>*:not(#rcp){display:none!important}body.th .modal{position:static;background:none;display:block}body.th .sheet{padding:0;max-width:72mm;overflow:visible}body.th #rcp{width:72mm;font-size:12px;border:0;margin:0}}


/* ===== v2 ===== */
:root{--bg:#eef1f5;--card:#fff;--ink:#0b2239;--mute:#5f7285;--line:#e1e7ee;--debt:#c0362c;--pay:#0f8a6d;--brass:#b8862b;--sh:0 1px 2px #0b22390d,0 8px 20px -10px #0b223333}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08141e;--card:#102535;--ink:#e9eff4;--mute:#8aa0b0;--line:#1d3547;--debt:#ff8277;--pay:#46d1ac;--brass:#e3b45a;--sh:0 1px 2px #0006,0 8px 20px -10px #000a}}
:root[data-theme="dark"]{--bg:#08141e;--card:#102535;--ink:#e9eff4;--mute:#8aa0b0;--line:#1d3547;--debt:#ff8277;--pay:#46d1ac;--brass:#e3b45a;--sh:0 1px 2px #0006,0 8px 20px -10px #000a}
body{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
main{padding:14px 14px 0}
header{background:linear-gradient(135deg,#0b2239,#14456b);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:4;box-shadow:0 6px 18px -8px #0b2239aa}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#d6a444,#a8761f);display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;box-shadow:0 4px 10px -2px #0006}
header b{font-size:17px;font-weight:800;display:block;line-height:1.2}
header small{color:#b9cddc;font-size:11px;display:block;margin-top:2px}
.sync{display:inline-block;padding:1px 9px;border-radius:99px;background:#ffffff1c;cursor:pointer;color:#e3b45a;font-size:10.5px}
.hi{width:42px;height:42px;min-height:0;padding:0;border-radius:12px;background:#ffffff1a;border:1px solid #ffffff26;color:#fff;display:grid;place-items:center}
.hi svg,#bn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h3{font-size:16px;font-weight:800;margin:18px 4px 8px}
.card{border-radius:14px;box-shadow:var(--sh);padding:14px}
.c{transition:transform .12s}.c:active{transform:scale(.99)}
.c .row{gap:12px}.nm{font-size:15.5px}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#0b2239,#14456b);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
button{border-radius:12px;min-height:44px;font-weight:600;transition:transform .12s,filter .15s}
button:active{transform:scale(.97)}button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
input,select,textarea{border-radius:12px;padding:12px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px #b8862b30}
.tabs{background:var(--line);padding:4px;border-radius:14px;gap:4px}
.tabs button{border:0;min-height:38px;background:transparent;color:var(--mute)}
.tabs button:not(.g){background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.hero{grid-template-columns:repeat(3,1fr)}.hero .card:not(:first-child){padding:10px}.hero .card:not(:first-child) b{font-size:16px}.sync{margin-top:3px}
.hero .card:first-child{grid-column:1/-1;background:linear-gradient(135deg,#0b2239,#1a5a86);border:0;padding:18px}
.hero .card:first-child span{color:#9fc0d6}.hero .card:first-child b{color:#fff!important;font-size:28px;margin-top:4px}
.tag{padding:3px 10px;font-weight:600}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:30px 12px;margin:8px 0}
.fab{bottom:calc(78px + env(safe-area-inset-bottom,0px));width:56px;height:56px;background:linear-gradient(145deg,#d6a444,#a8761f);box-shadow:0 10px 22px -6px #a8761faa;z-index:4}
.modal{backdrop-filter:blur(3px)}
.sheet{border-radius:22px 22px 0 0;animation:sup .28s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:'';display:block;width:42px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 14px}
@keyframes sup{from{transform:translateY(60px);opacity:0}}
#bn{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 22px -12px #0b223355}
#bn button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;padding:4px;background:transparent;color:var(--mute);font-size:11px;font-weight:600}
#bn button.on{color:var(--brass);font-weight:800}
@media print{#bn{display:none}}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--line);color:var(--ink)}.chip.hit{background:var(--brass);color:#fff;font-weight:700}
.hi{position:relative}.nb{position:absolute;top:-5px;left:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--debt);color:#fff;font:700 11px Cairo,sans-serif;font-style:normal;place-items:center}
.toast{display:none;position:fixed;top:calc(74px + env(safe-area-inset-top,0px));left:12px;right:12px;z-index:6;background:linear-gradient(135deg,#d6a444,#a8761f);color:#fff;padding:12px 14px;border-radius:14px;font-weight:700;box-shadow:0 10px 24px -8px #0008;text-align:center;cursor:pointer}
/* ===== v3: ثيم Circuit + تجاوب لابتوب/هاتف + واجهة دخول جديدة ===== */
:root{--bg:#eef2f7;--card:#fff;--ink:#0b1220;--mute:#5b6b7f;--line:#dde5ee;--debt:#dc2626;--pay:#059669;--brass:#0e7490;--brand:#0e7490;--onb:#fff;--sh:0 1px 2px #0b12200d,0 10px 24px -14px #0b122040}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080d16;--card:#111a2b;--ink:#e6edf7;--mute:#8a9bb2;--line:#1f2b40;--debt:#f87171;--pay:#34d399;--brass:#22d3ee;--brand:#22d3ee;--onb:#04222c;--sh:0 1px 2px #0008,0 10px 24px -14px #000c}}
:root[data-theme="dark"]{--bg:#080d16;--card:#111a2b;--ink:#e6edf7;--mute:#8a9bb2;--line:#1f2b40;--debt:#f87171;--pay:#34d399;--brass:#22d3ee;--brand:#22d3ee;--onb:#04222c;--sh:0 1px 2px #0008,0 10px 24px -14px #000c}
body{font-family:'IBM Plex Sans Arabic',Cairo,Tahoma,sans-serif;background-color:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1px);background-size:24px 24px}
button{background:var(--brand);color:var(--onb)}
.card{border-radius:16px}
header{background:linear-gradient(120deg,#0b1220 0%,#0c3347 55%,#0e7490 135%);padding:12px 18px}
header small{color:#a9bdd3}
.logo{background:linear-gradient(145deg,#22d3ee,#0e7490);color:#04222c;box-shadow:0 6px 14px -4px #0e7490aa}
.sync{background:#ffffff1a;color:#67e8f9}
.av{background:linear-gradient(145deg,#0e7490,#0b1220)}
.hero .card:first-child{background:linear-gradient(135deg,#0b1220,#0e7490)}
.hero .card:first-child span{color:#a5f3fc}
.fab{background:linear-gradient(145deg,#22d3ee,#0e7490);color:#04222c;box-shadow:0 10px 22px -6px #0e7490aa}
.toast{background:linear-gradient(135deg,#0e7490,#0b1220)}
input:focus,select:focus,textarea:focus{border-color:var(--brass);box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 22%,transparent)}
.hi{background:#ffffff1a;color:#fff}
.sb-brand,.sb-foot{display:none}
/* ---- تابلت وما فوق ---- */
@media(min-width:700px){
  main{max-width:900px;padding:18px 20px 0}
  #lst,#ml,#sl{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
  #lst>.card,#ml>.card,#sl>.card{margin-bottom:0}
  #lst>:not(.card),#ml>:not(.card),#sl>:not(.card){grid-column:1/-1}
  .modal{align-items:center;padding:20px}
  .sheet{border-radius:22px;max-width:620px;max-height:88vh;animation:pop .22s cubic-bezier(.2,.8,.2,1)}
  .sheet::before{display:none}
  @keyframes pop{from{transform:scale(.96);opacity:0}}
}
/* ---- لابتوب: شريط جانبي ---- */
@media(min-width:1024px){
  body{padding-right:248px;padding-bottom:28px}
  #bn{top:0;bottom:0;right:0;left:auto;width:248px;flex-direction:column;justify-content:flex-start;gap:4px;padding:20px 14px;background:#0b1220;border-top:0;box-shadow:none}
  #bn .sb-brand{display:flex;align-items:center;gap:12px;color:#fff;padding:4px 8px 22px}
  #bn .sb-brand b{display:block;font-size:17px}#bn .sb-brand small{color:#8fa3bb;font-size:11px}
  #bn button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;min-height:46px;padding:0 14px;color:#9fb0c6;border-radius:12px}
  #bn button:hover{background:#ffffff0d;color:#fff}
  #bn button.on{background:#ffffff14;color:#22d3ee;font-weight:700}
  #bn .sb-foot{display:block;margin-top:auto;padding:12px 8px 0;font-size:12px;color:#8fa3bb;border-top:1px solid #ffffff14}#bn .sb-foot b{color:#fff}
  header .brand .logo,header .brand b{display:none}
  main{max-width:1180px;padding:24px 32px 0}
  #lst,#ml,#sl{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
  .stats{grid-template-columns:repeat(3,1fr)}
  .hero{grid-template-columns:2fr 1fr 1fr 1fr}.hero .card:first-child{grid-column:auto}
  .fab{left:28px;bottom:28px}
  .toast{right:272px;left:24px}
  .tabs{max-width:560px}
}
@media(max-width:480px){.hi{width:38px;height:38px}header>div:last-child{gap:6px!important}.tabs button{font-size:13px;padding:6px 4px}}
@media(min-width:1024px){.hero .card{display:flex;flex-direction:column;justify-content:center}}
@media print{body{padding-right:0}}



/* ---- واجهة الدخول الأصلية (هاتف + كتاب) ---- */
/* login */
#lg{position:fixed;inset:0;z-index:99;display:flex;overflow:auto;color:#e9eff4;background:radial-gradient(900px 500px at 85% -10%,#c8963e33,transparent 60%),radial-gradient(700px 600px at 10% 110%,#1a5a8655,transparent 60%),linear-gradient(180deg,#0a1c2b,#06121c);transition:opacity .6s,transform .6s;padding:env(safe-area-inset-top,0px) 14px env(safe-area-inset-bottom,0px)}
#lg::before{content:'';position:absolute;inset:0;background-image:radial-gradient(#ffffff14 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:radial-gradient(circle at 50% 40%,#000,transparent 75%);mask-image:radial-gradient(circle at 50% 40%,#000,transparent 75%);pointer-events:none}

.lg-phone{width:276px;border-radius:44px;padding:10px;background:linear-gradient(145deg,#3a4a57,#10181f 40%,#27333d);box-shadow:0 40px 80px -20px #000c,0 0 0 1px #ffffff1a;position:relative}

.lg-t{font-size:24px;font-weight:800;letter-spacing:.3px}.lg-sub{font-size:12px;color:#e3b45a}
.lg-ln{width:34px;height:2px;border-radius:2px;background:#e3b45a;margin:9px 0 10px}
.lg-m{font-size:13.5px;font-weight:700}.lg-s2{font-size:11px;color:#8da6b8;min-height:16px}

.lg-d i.on{background:#e3b45a;border-color:#e3b45a;transform:scale(1.15)}
.lg-e{min-height:18px;font-size:12px;color:#ff8a80}
.kp{display:grid;grid-template-columns:repeat(3,58px);gap:10px;direction:ltr}
#lg .kp button{width:58px;height:58px;min-height:0;padding:0;border-radius:50%;background:#ffffff12;border:1px solid #ffffff1c;color:#fff;font-size:22px;font-weight:600}
#lg .kp button:active{background:#e3b45a66}
#lg .kp .ke{background:#c8963e;border-color:#c8963e}
#lg .lg-f{background:none;border:0;color:#8da6b8;min-height:0;padding:10px 6px 0;font-size:12px;font-weight:400;text-decoration:underline}
.lg-by{font-size:13px;color:#e3b45a;animation:lgfade 1.6s .9s both}.lg-by b{color:#fff}
@keyframes lgfade{from{opacity:0}}
.shk{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.bk{position:relative;width:150px;height:100px;perspective:700px;direction:ltr;transform:scale(.8)}
.bk i{position:absolute;display:block}
.cv{inset:-7px -8px -7px;background:linear-gradient(145deg,#d6a444,#a8761f);border-radius:6px;box-shadow:0 8px 16px #0007}

@keyframes flp{0%,10%{transform:rotateY(0)}90%,100%{transform:rotateY(-176deg)}}

.lg-pn{display:flex;flex-direction:column;align-items:center;width:100%}

.pa-in::placeholder{color:#8da6b8}.pa-in:focus{border-color:#e3b45a;box-shadow:0 0 0 3px #e3b45a30}

</head>
<body>

<main id="app"></main>
<button class="fab" id="fab" onclick="openDebt()" aria-label="إضافة دين">＋</button>
<nav id="bn"><div class="sb-brand"><div class="logo">ح</div><div><b>حسن صدام</b><small>المحاسبة وإدارة المحل</small></div></div><button onclick="st.p='home';render()"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>الزبائن</button><button onclick="sh('hub')"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M12 18h.01"/></svg>المحل</button><button onclick="st.p='stock';render()"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>المخزون</button><button onclick="st.p='rep';render()"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>التقارير</button><div class="sb-foot">تم تصميمه بواسطة <b>حسن صدام</b></div></nav>
<div id="nt" class="toast" onclick="this.style.display='none';ntOpen()"></div><div id="m"></div>
<div id="lg"><div class="lg-in"><div class="lg-phone" id="lph"><div class="lg-scr"><i class="lg-isl"></i>

<div class="lg-bkw"><div class="bk"><i class="cv"></i><i class="pg pgl"></i><i class="pg pgr"></i><i class="fp f1"></i><i class="fp f2"></i><i class="fp f3"></i></div></div>

<div class="pa-seg"><button id="au_b0" class="on" onclick="authMode(0)">دخول</button><button id="au_b1" onclick="authMode(1)">حساب جديد</button></div>
<input class="pa-in" id="au_e" type="email" inputmode="email" autocomplete="username" placeholder="البريد الإلكتروني" onkeydown="if(event.key==='Enter')$('au_p').focus()">
<div class="pa-pw"><input class="pa-in" id="au_p" type="password" autocomplete="current-password" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter')authGo()"><button type="button" class="eye" onclick="authEye()" aria-label="إظهار كلمة المرور"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
<div id="au_l2" style="display:none;width:100%"><input class="pa-in" id="au_p2" type="password" autocomplete="new-password" placeholder="تأكيد كلمة المرور" onkeydown="if(event.key==='Enter')authGo()"></div>

<script>
var KEY='hs_acc_v1',db={cust:[],tx:[],prod:[],seq:0,set:{cur:'د.ع',cc:'964',shop:'حسن صدام',ft:'شكراً لتعاملكم معنا',rate:1500}},st={p:'home',id:null,q:'',f:'all'};
try{var s=localStorage.getItem(KEY);if(s)db=Object.assign(db,JSON.parse(s))}catch(e){}
function save(){db.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}if(cloud){clearTimeout(timer);cst('…');timer=setTimeout(push,900)}}
var $=function(i){return document.getElementById(i)};
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(n,c){return (c==='USD'?'$':'')+Number(n).toLocaleString('en-US',{maximumFractionDigits:2})+(c==='USD'?'':' '+db.set.cur)}
function rate(){return db.set.rate||1500}
function iq(t){return t.amt*(t.cur==='USD'?rate():1)}
function balC(id,c){return db.tx.reduce(function(a,t){return t.cid===id&&(t.cur||'IQD')===c?a+(t.type==='debt'?t.amt:-t.amt):a},0)}
function bal(id){return balC(id,'IQD')+balC(id,'USD')*rate()}
function balS(id){var i=balC(id,'IQD'),u=balC(id,'USD'),p=[];if(i)p.push(fmt(i));if(u)p.push(fmt(u,'USD'));return p.join(' + ')||fmt(0)}
function dt(d){var x=new Date(d);return x.toLocaleDateString('en-GB')+' '+x.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
function intl(p){p=String(p||'').replace(/\D/g,'');if(p.indexOf('00')===0)p=p.slice(2);else if(p.charAt(0)==='0')p=db.set.cc+p.slice(1);return p}

function render(){
  var h='';navAct();ntBadge();$('fab').style.display=st.p==='home'?'block':'none';if(st.p==='stock')return stock();if(st.p==='shop')return shop();if(st.p==='rep')return rep();
  if(st.p==='home'){
    var tot=0,n=0,paid=0,gd=0,gp=0;db.tx.forEach(function(t){if(t.ret)return;if(t.type==='debt')gd+=iq(t);else gp+=iq(t)});db.cust.forEach(function(c){var b=bal(c.id);if(b>0){tot+=b;n++}});
    db.tx.forEach(function(t){if(t.type==='pay')paid+=iq(t)});
    h+='<div class="stats hero"><div class="card"><span>المبلغ المتبقي (إجمالي الديون)</span><b class="debt">'+fmt(tot)+'</b></div><div class="card"><span>الدين الكلي</span><b>'+fmt(gd)+'</b></div><div class="card"><span>الواصل كلياً</span><b class="pay">'+fmt(gp)+'</b></div><div class="card"><span>زبائن متأخرون</span><b class="debt">'+db.cust.filter(function(c){return odAmt(c.id)>0}).length+'</b></div></div>';
    h+='<div class="btns"><button class="d" onclick="openDebt()">＋ إضافة دين</button><button class="g" onclick="openCust()">＋ زبون جديد</button></div>';h+='<input id="q" placeholder="ابحث بالاسم أو الرقم" value="'+esc(st.q)+'" oninput="st.q=this.value;list()">';
    h+='<div class="tabs"><button class="'+(st.f==='all'?'':'g')+'" onclick="st.f=\'all\';render()">الكل</button><button class="'+(st.f==='debt'?'':'g')+'" onclick="st.f=\'debt\';render()">عليهم دين</button><button class="'+(st.f==='clear'?'':'g')+'" onclick="st.f=\'clear\';render()">خالصون</button><button class="'+(st.f==='late'?'':'g')+'" onclick="st.f=\'late\';render()">متأخرون</button></div><select onchange="st.so=this.value;list()">'+[['bal','الترتيب: الأكبر ديناً'],['late','المتأخرون أولاً'],['recent','الأحدث حركة'],['name','الاسم']].map(function(o){return '<option value="'+o[0]+'"'+((st.so||'bal')===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select><div id="lst"></div>';
    h+='<div class="btns"><button class="g" onclick="backup()">نسخ احتياطي</button><button class="g" onclick="restore()">استرجاع</button><button class="g" onclick="report()">كشف عام</button></div>';
    $('app').innerHTML=h;list();
  }else{
    var c=db.cust.find(function(x){return x.id===st.id});if(!c){st.p='home';return render()}
    var b=bal(c.id),tx=db.tx.filter(function(t){return t.cid===c.id}).sort(function(a,b){return b.d-a.d});
    h+='<button class="g" onclick="st.p=\'home\';render()">→ رجوع</button>';
    h+='<div class="card" style="margin-top:10px"><div class="row"><div><div class="nm" style="font-size:18px">'+esc(c.name)+'</div><div class="ph">'+esc(c.phone||'بدون رقم')+'</div></div><div style="text-align:left"><span class="tag">الرصيد</span><div class="'+(b>0?'debt':'pay')+'" style="font-size:20px">'+balS(c.id)+'</div></div></div>';
    h+='<div class="btns"><button class="d" onclick="openTx(\''+c.id+'\',\'debt\')">＋ فاتورة دين</button><button class="p" onclick="openTx(\''+c.id+'\',\'pay\')">تسديد</button><button class="g" onclick="quickDebt(\''+c.id+'\')">دين بمبلغ</button></div>';
    h+='<div class="btns"><button class="wa" onclick="stmt(\''+c.id+'\',\'wa\')">كشف حساب واتساب</button><button class="tg" onclick="stmt(\''+c.id+'\',\'tg\')">تيليكرام</button><button class="g" onclick="openCust(\''+c.id+'\')">تعديل</button></div>'+(odAmt(c.id)>0?'<button class="d" style="width:100%" onclick="remind(\''+c.id+'\')">تذكير بالمتأخر: '+fmt(odAmt(c.id))+'</button>':'')+(c.lim?'<div class="ph" style="direction:rtl;margin-top:6px">الحد الائتماني: '+fmt(c.lim)+'</div>':'')+'</div>';
    h+=debtCard(c.id);h+='<h3>الحركات</h3>';
    if(!tx.length)h+='<div class="empty">لا توجد حركات. أضف أول دين من الأعلى.</div>';
    tx.forEach(function(t){h+='<div class="card c" onclick="openReceipt(\''+t.id+'\')"><div class="row"><div><span class="'+(t.type==='debt'?'debt':'pay')+'">'+(t.type==='debt'?'دين ':'تسديد ')+fmt(t.amt,t.cur)+'</span><div class="ph" style="direction:rtl">'+dt(t.d)+(t.note?' — '+esc(t.note):'')+(t.due?' | استحقاق '+new Date(t.due).toLocaleDateString('en-GB'):'')+'</div></div><span class="tag">وصل</span></div></div>'});
    h+='<button class="g" style="width:100%;margin-top:8px;color:var(--debt)" onclick="delCust(\''+c.id+'\')">حذف الزبون</button>';
    $('app').innerHTML=h;
  }
}
function list(){
  var q=st.q.trim().toLowerCase(),out='';
  var a=db.cust.filter(function(c){var b=bal(c.id);if(st.f==='debt'&&b<=0)return false;if(st.f==='clear'&&b>0)return false;if(st.f==='late'&&odAmt(c.id)<=0)return false;return !q||c.name.toLowerCase().indexOf(q)>-1||String(c.phone||'').indexOf(q)>-1}).sort(function(x,y){var o=st.so||'bal';return o==='name'?x.name.localeCompare(y.name):o==='late'?odAmt(y.id)-odAmt(x.id):o==='recent'?lastTx(y.id)-lastTx(x.id):bal(y.id)-bal(x.id)});
  if(!a.length)out='<div class="empty">'+(db.cust.length?'لا نتائج.':'ابدأ بإضافة أول زبون بزر ＋')+'</div>';
  a.forEach(function(c){var b=bal(c.id);out+='<div class="card c" onclick="st.p=\'cust\';st.id=\''+c.id+'\';render()"><div class="row"><div class="av">'+esc(c.name.trim().charAt(0))+'</div><div style="flex:1;min-width:0"><div class="nm">'+esc(c.name)+'</div><div class="ph">'+esc(c.phone||'')+(odAmt(c.id)>0?' <span class="tag" style="background:var(--debt);color:#fff">متأخر</span>':'')+'</div></div><div style="text-align:left"><div class="'+(b>0?'debt':'pay')+'">'+balS(c.id)+'</div><div class="ph" style="direction:rtl;font-size:11px">الكلي '+csum(dtot(c.id).d)+' • الواصل '+csum(dtot(c.id).p)+'</div></div></div></div>'});
  $('lst').innerHTML=out;
}
function modal(h){$('m').innerHTML='<div class="modal" onclick="if(event.target===this)closeM()"><div class="sheet">'+h+'</div></div>'}
function closeM(){$('m').innerHTML=''}
function openCust(id){
  var c=id?db.cust.find(function(x){return x.id===id}):{name:'',phone:''};
  modal('<h3>'+(id?'تعديل زبون':'زبون جديد')+'</h3><input id="cn" placeholder="الاسم" value="'+esc(c.name)+'"><input id="cp" type="tel" placeholder="رقم الهاتف (مثال 0770...)" value="'+esc(c.phone)+'"><input id="cl" type="number" placeholder="الحد الائتماني (اختياري)" value="'+(c.lim||'')+'"><div class="btns"><button onclick="saveCust(\''+(id||'')+'\')">حفظ</button><button class="g" onclick="closeM()">إلغاء</button></div>');
}
function saveCust(id){
  var n=$('cn').value.trim(),p=$('cp').value.trim(),l=parseFloat($('cl').value)||0;if(!n)return $('cn').focus();
  if(id){var c=db.cust.find(function(x){return x.id===id});c.name=n;c.phone=p;c.lim=l}else db.cust.push({id:'c'+Date.now(),name:n,phone:p,lim:l});
  save();closeM();render();
}
function delCust(id){if(!confirm('حذف الزبون وكل حركاته؟'))return;db.cust=db.cust.filter(function(c){return c.id!==id});db.tx=db.tx.filter(function(t){return t.cid!==id});save();st.p='home';render()}
function msg(t){if(t.form==='debt')return debtMsg(t);
  var c=db.cust.find(function(x){return x.id===t.cid}),b=bal(c.id),s=db.set;
  return '🧾 *'+s.shop+'*\n'+(t.type==='debt'?'وصل دين':'وصل تسديد')+' رقم '+(t.no||t.id.slice(-5))+'\n━━━━━━━━\nالزبون: '+c.name+(t.items?'\n'+t.items.map(function(i){return '• '+i.n+' × '+i.q+' = '+fmt(i.q*i.p,t.cur)}).join('\n')+(t.disc?'\nخصم: '+fmt(t.disc,t.cur):''):'')+'\nالمبلغ: '+fmt(t.amt,t.cur)+(t.note?'\nالتفاصيل: '+t.note:'')+'\nالتاريخ: '+dt(t.d)+(t.due?'\nالاستحقاق: '+new Date(t.due).toLocaleDateString('en-GB'):'')+(t.wm?'\nالضمان حتى: '+wend(t).toLocaleDateString('en-GB'):'')+'\n━━━━━━━━\nالرصيد الحالي: '+balS(c.id)+'\n'+s.ft;
}
function openReceipt(id,fresh){
  var t=db.tx.find(function(x){return x.id===id}),c=db.cust.find(function(x){return x.id===t.cid});
  modal('<h3>'+(fresh?'تم الحفظ ✓':'الوصل')+'</h3><div class="rc" id="rcp">'+esc(msg(t).replace(/\*/g,''))+'</div><div class="btns"><button class="wa" onclick="send(\''+id+'\',\'wa\')">واتساب</button><button class="tg" onclick="send(\''+id+'\',\'tg\')">تيليكرام</button></div><div class="btns"><button class="g" onclick="thermal()">طباعة حرارية</button><button class="g" onclick="editTx(\''+id+'\')">تعديل</button>'+(t.items&&!t.ret?'<button class="g" onclick="retTx(\''+id+'\')">مرتجع</button>':'')+'<button class="g" onclick="delTx(\''+id+'\')" style="color:var(--debt)">حذف الحركة</button><button class="g" onclick="closeM()">إغلاق</button></div>'+(c.phone?'':'<p class="ph" style="direction:rtl">لا يوجد رقم لهذا الزبون، سيُطلب منك اختيار جهة الاتصال يدوياً.</p>'));
}
function delTx(id){if(!confirm('حذف هذه الحركة؟'))return;var x=db.tx.find(function(t){return t.id===id});if(x&&x.items)x.items.forEach(function(i){var p=db.prod.find(function(q){return q.id===i.pid});if(p)p.qty+=i.q;var m2=i.mid&&!i.dv&&mdlOf(i.mid);if(m2)m2.qty=(m2.qty||0)+i.q;if(i.dv){var dd=db.dev.find(function(q){return q.id===i.dv});if(dd)dd.st='stock'}});db.tx=db.tx.filter(function(t){return t.id!==id});save();closeM();render()}
function go(kind,text,phone){
  var u=kind==='wa'?'https://wa.me/'+(intl(phone)||'')+'?text='+encodeURIComponent(text):'https://t.me/share/url?url=%20&text='+encodeURIComponent(text);
  window.open(u,'_blank');
}
function send(id,kind){var t=db.tx.find(function(x){return x.id===id}),c=db.cust.find(function(x){return x.id===t.cid});go(kind,msg(t),c.phone)}
function stmt(cid,kind){
  var c=db.cust.find(function(x){return x.id===cid}),tx=db.tx.filter(function(t){return t.cid===cid}).sort(function(a,b){return a.d-b.d}).slice(-15);
  var s='📋 *كشف حساب — '+db.set.shop+'*\nالزبون: '+c.name+'\n━━━━━━━━\n';
  tx.forEach(function(t){s+=(t.type==='debt'?'➕ دين ':'➖ تسديد ')+fmt(t.amt,t.cur)+' — '+new Date(t.d).toLocaleDateString('en-GB')+(t.note?' ('+t.note+')':'')+'\n'});
  s+='━━━━━━━━\nالمتبقي: '+balS(cid);go(kind,s,c.phone);
}
function report(){
  var s='<h3>كشف عام بالديون</h3>',tot=0;
  db.cust.filter(function(c){return bal(c.id)>0}).sort(function(a,b){return bal(b.id)-bal(a.id)}).forEach(function(c){var b=bal(c.id);tot+=b;s+='<div class="row card"><span>'+esc(c.name)+'</span><span class="debt">'+fmt(b)+'</span></div>'});
  s+='<div class="row card"><b>المجموع</b><b class="debt">'+fmt(tot)+'</b></div><div class="btns"><button class="g" onclick="window.print()">طباعة</button><button class="g" onclick="closeM()">إغلاق</button></div>';modal(s);
}
function openSettings(){
  var s=db.set;modal('<h3>الإعدادات</h3>اسم المحل<input id="s1" value="'+esc(s.shop)+'">العملة<input id="s2" value="'+esc(s.cur)+'">مفتاح الدولة للأرقام (العراق 964، السعودية 966، مصر 20)<input id="s3" inputmode="numeric" value="'+esc(s.cc)+'">ذيل الوصل<input id="s4" value="'+esc(s.ft)+'">سعر الدولار (دينار لكل 1$)<input id="s5" type="number" value="'+rate()+'"><button class="g" style="width:100%;margin:6px 0" onclick="closeM();lgLock()">🔒 ضبط رمز القفل</button><button class="g" style="width:100%;margin:6px 0" onclick="ntAsk()">🔔 تفعيل إشعارات الجهاز</button><div class="btns"><button onclick="saveSet()">حفظ</button><button class="g" onclick="closeM()">إلغاء</button></div>');
}
function saveSet(){db.set={shop:$('s1').value||'حسن صدام',cur:$('s2').value||'',cc:$('s3').value.replace(/\D/g,''),ft:$('s4').value,rate:parseFloat($('s5').value)||1500};save();closeM();render()}
function backup(){
  modal('<h3>نسخة احتياطية</h3><p>انسخ النص واحفظه في مكان آمن:</p><textarea id="bk" rows="6" readonly>'+esc(JSON.stringify(db))+'</textarea><div class="btns"><button onclick="$(\'bk\').select();document.execCommand(\'copy\')">نسخ</button><button class="g" onclick="closeM()">إغلاق</button></div>');
}
function restore(){
  modal('<h3>استرجاع نسخة</h3><textarea id="rs" rows="6" placeholder="الصق النسخة هنا"></textarea><div class="btns"><button onclick="doRestore()">استرجاع</button><button class="g" onclick="closeM()">إلغاء</button></div>');
}
function doRestore(){try{var o=JSON.parse($('rs').value);if(!o.cust||!o.tx)throw 0;if(!confirm('سيتم استبدال البيانات الحالية. متابعة؟'))return;db=Object.assign({prod:[]},o);ens();save();closeM();render()}catch(e){alert('النص غير صالح')}}

function editTx(id){
  var t=db.tx.find(function(x){return x.id===id}),inv=!!t.items;
  modal('<h3>تعديل الحركة</h3>'+(inv?'<p class="ph" style="direction:rtl">مبلغ الفاتورة لا يُعدَّل (احذفها وأنشئها من جديد)، ويمكن تعديل الملاحظة وتاريخ الاستحقاق.</p>':inp('ed_a','المبلغ',t.amt,'number'))+inp('ed_n','ملاحظة',t.note)+(t.type==='debt'?'<label class="ph" style="direction:rtl">تاريخ الاستحقاق</label><input id="ed_d" type="date" value="'+(t.due?new Date(t.due).toISOString().slice(0,10):'')+'">':'')+'<div class="btns"><button onclick="editSave(\''+id+'\')">حفظ</button><button class="g" onclick="closeM()">إلغاء</button></div>');
}
function editSave(id){var t=db.tx.find(function(x){return x.id===id});if(!t.items){var a=gn('ed_a');if(!(a>0))return;t.amt=a}t.note=gv('ed_n');if($('ed_d')){var v=$('ed_d').value;if(v)t.due=new Date(v+'T23:59:59').getTime();else delete t.due}save();closeM();render();openReceipt(id)}

function thToggle(){var d=document.documentElement,cur=d.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),n=cur==='dark'?'light':'dark';d.setAttribute('data-theme',n);try{localStorage.setItem('hs_theme',n)}catch(e){}}

/* ===== دخول احترافي موحّد ===== */
var __am=0;
function lgPanel(n){['lgLoad','lgAuth','lgPin'].forEach(function(i){var e=$(i);if(e)e.style.display=i===n?'':'none'})}
function lgVisible(){var o=$('lg');return o.style.display!=='none'&&!o.classList.contains('out')}
function lgShowAuth(){var o=$('lg');lgPanel('lgAuth');o.style.display='flex';void o.offsetWidth;o.classList.remove('out');authMode(__am)}
function lgAfterAuth(){if(getPin()){lgInit();lgPanel('lgPin');var o=$('lg');o.style.display='flex';o.classList.remove('out')}else lgOpen()}
function lgInit(){var h=getPin();lgBuf='';lgStep=0;lgFirst='';$('lt').textContent=h?'أدخل رمز القفل':'أنشئ رمز قفل';$('lsub').textContent=h?'للدخول إلى المنصة':'4 أرقام على الأقل ثم اضغط ✓';$('lf').style.display=h?'':'none';$('lc').style.display=h?'none':'';$('le').textContent='';lgDots()}
function lgLock(){var o=$('lg');lgInit();lgPanel('lgPin');o.style.display='flex';void o.offsetWidth;o.classList.remove('out')}
function lgForgot(){
  var fb=window.firebase&&firebase.auth&&firebase.auth().currentUser;
  if(!confirm(fb?'سيُحذف الرمز ويُطلب منك تسجيل الدخول بكلمة المرور من جديد. متابعة؟':'سيُحذف رمز القفل فقط وتبقى بياناتك. متابعة؟'))return;
  try{localStorage.removeItem('hs_pin')}catch(e){}
  if(fb){try{localStorage.removeItem(KEY)}catch(e){}firebase.auth().signOut().then(function(){location.reload()},function(){location.reload()})}else lgOpen();
}
function authMode(m){
  __am=m;var T=['تسجيل الدخول','إنشاء حساب جديد'],S=['أهلاً بعودتك، أدخل بيانات حسابك','أنشئ حسابك لحفظ بياناتك ومزامنتها'];
  $('au_t').textContent=T[m];$('au_s').textContent=S[m];$('au_b0').className=m?'':'on';$('au_b1').className=m?'on':'';
  $('au_l2').style.display=m?'':'none';$('au_f').style.display=m?'none':'';$('au_go').textContent=m?'إنشاء الحساب':'تسجيل الدخول';
  $('au_p').setAttribute('autocomplete',m?'new-password':'current-password');aM('');
}
function aM(t,ok){var e=$('au_m');e.textContent=t;e.style.color=ok?'#6ee7b7':'#ff8a80'}
function authEye(){var i=$('au_p');i.type=i.type==='password'?'text':'password'}
function authErr(c){var M={'auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة','auth/wrong-password':'كلمة المرور غير صحيحة','auth/user-not-found':'لا يوجد حساب بهذا البريد','auth/invalid-email':'صيغة البريد غير صحيحة','auth/email-already-in-use':'هذا البريد مسجّل مسبقاً، سجّل الدخول','auth/weak-password':'كلمة المرور ضعيفة (6 أحرف على الأقل)','auth/too-many-requests':'محاولات كثيرة، حاول لاحقاً','auth/network-request-failed':'تعذّر الاتصال بالإنترنت','auth/operation-not-allowed':'فعّل Email/Password من Firebase Console','auth/unauthorized-domain':'أضف نطاق الموقع في Authorized domains'};return M[c]||('تعذّر الدخول ('+String(c||'').replace('auth/','')+')')}
async function authGo(){
  var e=gv('au_e'),p=$('au_p').value,B=$('au_go');
  if(!e||!p)return aM('أدخل البريد وكلمة المرور');
  if(__am===1&&p!==$('au_p2').value)return aM('كلمتا المرور غير متطابقتين');
  B.disabled=true;B.textContent='جارٍ المعالجة…';aM('');
  try{
    var P=firebase.auth.Auth&&firebase.auth.Auth.Persistence;
    if(P)await firebase.auth().setPersistence($('au_r').checked?P.LOCAL:P.SESSION);
    if(__am===1)await firebase.auth().createUserWithEmailAndPassword(e,p);else await firebase.auth().signInWithEmailAndPassword(e,p);
  }catch(x){aM(authErr(x&&x.code))}
  B.disabled=false;B.textContent=__am?'إنشاء الحساب':'تسجيل الدخول';
}
async function authReset(){var e=gv('au_e');if(!e)return aM('اكتب بريدك أولاً ثم اضغط «نسيت كلمة المرور»');try{await firebase.auth().sendPasswordResetEmail(e);aM('أُرسل رابط إعادة التعيين إلى بريدك',1)}catch(x){aM(authErr(x&&x.code))}}
function authOpen(){lgShowAuth()}
function authOut(){if(!confirm('تسجيل الخروج؟ تُحذف النسخة المحلية من هذا الجهاز وتبقى بياناتك في حسابك.'))return;try{localStorage.removeItem(KEY)}catch(e){}firebase.auth().signOut().then(function(){location.reload()},function(){location.reload()})}
document.addEventListener('keydown',function(e){var o=$('lg');if(o.style.display==='none'||o.classList.contains('out'))return;if($('lgAuth').style.display!=='none'){if(e.key==='Enter')authGo();return}if($('lgPin').style.display==='none')return;if(/^\d$/.test(e.key))lgKey(e.key);else if(e.key==='Backspace')lgKey('b');else if(e.key==='Enter')lgKey('e')});
/* ===== إضافة دين لشخص + وصل واتساب ===== */
function openDebt(cid){
  var dl='<datalist id="dt_dl">'+db.mdl.map(function(m){return '<option value="'+esc(m.name)+'">'}).concat(db.prod.map(function(p){return '<option value="'+esc(p.name)+'">'})).join('')+'</datalist>';
  modal('<h3>＋ إضافة دين</h3>'+custPick('dt').replace("onchange=\"custFill('dt')\"","onchange=\"custFill('dt');dtT()\"")+csel('dt_k').replace('<select','<select onchange="dtT()"')
   +'<input id="dt_d" list="dt_dl" placeholder="اسم الهاتف أو القطعة (اختياري)" oninput="dtPick()" autocomplete="off">'+dl
   +'<div class="row" style="gap:8px"><input id="dt_pr" type="number" inputmode="decimal" placeholder="سعر الهاتف / القطعة" oninput="this.dataset.m=1;dtAuto()"><input id="dt_q" type="number" inputmode="decimal" placeholder="الكمية" value="1" style="max-width:90px" oninput="dtAuto()"></div>'
   +'<input id="dt_a" type="number" inputmode="decimal" placeholder="مبلغ الدين" oninput="this.dataset.m=1;dtT()"><input id="dt_r" type="number" inputmode="decimal" placeholder="المبلغ الواصل الآن (اختياري)" oninput="dtT()">'
   +'<div id="dt_t" class="card"></div><label class="ph" style="direction:rtl">تاريخ التسديد (اختياري)</label><input id="dt_due" type="date"><input id="dt_note" placeholder="ملاحظة (اختياري)">'
   +'<label style="display:block;margin:6px 0"><input id="dt_w" type="checkbox" style="width:auto" checked> إرسال وصل الدين على واتساب بعد الحفظ</label><div class="btns"><button class="d" onclick="doDebt()">حفظ الدين وإرسال الوصل</button><button class="g" onclick="closeM()">إلغاء</button></div>');
  if(cid)$('dt_c').value=cid;custFill('dt');dtT();
}
function dtPick(){var n=gv('dt_d'),m=n&&mdlFind(n),p=!m&&n&&db.prod.find(function(x){return nz(x.name)===nz(n)}),s=m||p;if(s&&s.price&&!$('dt_pr').dataset.m){$('dt_pr').value=s.price;dtAuto()}}
function dtAuto(){if(!$('dt_a').dataset.m)$('dt_a').value=gn('dt_pr')*(gn('dt_q')||1)||'';dtT()}
function dtT(){
  var k=$('dt_k').value,am=gn('dt_a'),rc=Math.min(Math.max(gn('dt_r'),0),am),cid=$('dt_c').value,prev=cid?balC(cid,k):0;
  $('dt_t').innerHTML='<div class="row"><span>المبلغ</span><b>'+fmt(am,k)+'</b></div><div class="row"><span>الواصل</span><b class="pay">'+fmt(rc,k)+'</b></div><div class="row"><span>المتبقي من هذا الدين</span><b class="debt">'+fmt(am-rc,k)+'</b></div>'+(cid?'<div class="row"><span>دينه السابق</span><b>'+fmt(prev,k)+'</b></div>':'')+'<div class="row"><span>إجمالي دينه بعد الحفظ</span><b class="debt">'+fmt(prev+am-rc,k)+'</b></div>';
}
function doDebt(){
  var k=$('dt_k').value,am=gn('dt_a'),rc=Math.min(Math.max(gn('dt_r'),0),am),q=gn('dt_q')||1,pr=gn('dt_pr'),ds=gv('dt_d'),send=$('dt_w').checked,now=Date.now();
  if(!(am>0))return alert('اكتب مبلغ الدين');
  var cid=custResolve('dt');if(!cid)return;
  var t={id:'t'+now,cid:cid,type:'debt',cur:k,amt:am,note:gv('dt_note'),d:now,paid:rc,form:'debt',no:db.seq=(db.seq||0)+1},dd=$('dt_due').value;
  if(dd)t.due=new Date(dd+'T23:59:59').getTime();
  if(ds||pr){
    t.items=[{n:ds||'دين',q:q,p:pr||am/q,c:0}];
    var m=ds&&mdlFind(ds),pd=!m&&ds&&db.prod.find(function(x){return nz(x.name)===nz(ds)});
    if(m){if(q>(m.qty||0)&&!confirm('الكمية أكبر من المتوفر ('+(m.qty||0)+'). متابعة؟'))return;t.items[0].mid=m.id;t.items[0].c=m.cost||0;m.qty=Math.max(0,(m.qty||0)-q)}
    else if(pd){if(q>pd.qty&&!confirm('الكمية أكبر من المخزون. متابعة؟'))return;t.items[0].pid=pd.id;t.items[0].c=pd.cost||0;pd.qty=Math.max(0,pd.qty-q)}
  }
  db.tx.push(t);if(rc>0)db.tx.push({id:'t'+(now+1),cid:cid,type:'pay',cur:k,amt:rc,note:'الواصل عند الدين',d:now+1});
  save();closeM();render();
  var c=db.cust.find(function(x){return x.id===cid});
  if(send&&c.phone)go('wa',debtMsg(t),c.phone);
  openReceipt(t.id,true);
}
function debtMsg(t){
  var s=db.set,c=db.cust.find(function(x){return x.id===t.cid})||{},it=(t.items||[])[0],rest=Math.max(0,t.amt-(t.paid||0));
  return '🧾 *'+(s.shop||'')+'* — وصل دين\nأهلاً بك '+(c.name||'')+' 🌹\n\nرقم الوصل: '+(t.no||'')+'\nالتاريخ: '+dt(t.d)+(it?'\nالتفاصيل: '+it.n+(it.q>1?' × '+it.q:'')+(it.p?' (سعر الوحدة '+fmt(it.p,t.cur)+')':''):'')+(t.note?'\nملاحظة: '+t.note:'')+'\n━━━━━━━━\nالمبلغ: '+fmt(t.amt,t.cur)+'\nالواصل: '+fmt(t.paid||0,t.cur)+'\n*المتبقي من هذا الدين: '+fmt(rest,t.cur)+'*\n━━━━━━━━\n*إجمالي دينك المتبقي: '+balS(t.cid)+'*'+(t.due?'\nموعد التسديد: '+dstr(t.due):'')+'\n\n'+(s.ft||'');
}
function quickDebt(cid){openDebt(cid)}
lgPanel(window.firebase?'lgLoad':'lgPin');if(!window.firebase)lgAfterAuth();


render();
</script>
